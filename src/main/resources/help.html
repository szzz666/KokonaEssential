<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
          background:#f5f5f5;
          padding:28px 24px; width:520px; }
        .header { text-align:center; margin-bottom:24px; }
        .header h1 { color:#333; font-size:24px; font-weight:700;
          letter-spacing:1px; }
        .header p { color:#666; font-size:13px; margin-top:6px; }
        .card { background:#ffffff;
          border-radius:14px; padding:16px 18px; margin-bottom:14px;
          border:1px solid #e0e0e0; }
        .card-title { color:#333; font-size:15px; font-weight:600;
          margin-bottom:10px; padding-bottom:8px;
          border-bottom:1px solid #e0e0e0; }
        .cmd-row { display:flex; justify-content:space-between; align-items:center;
          padding:4px 0; }
        .cmd-name { color:#333; font-size:14px; font-weight:500; }
        .cmd-perm { background:#f0f0f0; color:#555; font-size:11px;
          padding:2px 10px; border-radius:10px;
          border:1px solid #d0d0d0; }
        .cmd-desc { color:#777; font-size:12px;
          padding:2px 0 8px 0; }
        .footer { text-align:center; color:#999;
          font-size:11px; margin-top:8px; }
    </style>
</head>
<body>
<div class="header"><h1>Kokona Essential</h1>
    <p>可用功能一览</p></div>
<!--%cards%-->
<div class="footer">输入命令即可使用对应功能</div>
</body>
</html>
